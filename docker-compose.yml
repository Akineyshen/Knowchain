version: '3.9'
services:
  landing-client:
    build: ./landing/client
    container_name: landing-client
    ports:
      - "3000:80"

  app-client:
    build: ./app/client
    container_name: app-client
    ports:
      - "3001:80"

  dashboard-client:
    build: ./dashboard/client
    container_name: dashboard-client
    ports:
      - "3002:80"

  app-server:
    build: ./app/server
    container_name: app-server
    ports:
      - "4000:3000"
    restart: unless-stopped